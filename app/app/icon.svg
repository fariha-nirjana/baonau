<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Baonau — Bunbun's little treasure boat</title>
<desc id="desc">The original green Bunbun character with a cream face and pink cheeks peeks over a golden boat, with a padlock emblem, on a mint rounded square.</desc>
<defs>
