 <linearGradient id="hull-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2D28B"/><stop offset="1" stop-color="#D9B568"/></linearGradient>
 <clipPath id="icon-clip"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
