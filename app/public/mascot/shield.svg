<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Mimo / Shield up expression (v2)
    Defensive pose: whole body leans 6deg into the shield (pivot: 256,470),
    braced stance with the left foot back and the right foot forward,
    shield angled and held low on the right so both eyes stay visible,
    left arm reaching across to grip the shield edge.
    The right arm is still drawn behind the shield for animation.
  -->

  <!-- Whoosh lines, behind everything (pivot: 50,235) -->
  <g id="whoosh">
    <path d="M74 132 Q30 230 70 336" fill="none" stroke="#6CCBA6" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M48 168 Q22 232 44 300" fill="none" stroke="#6CCBA6" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M498 330 Q510 390 486 440" fill="none" stroke="#6CCBA6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Ground shadow -->
  <g id="shadow">
    <ellipse cx="262" cy="483" rx="150" ry="11" fill="#2E6B57" opacity="0.12"/>
  </g>

  <!-- Feet: braced stance (back foot darker and tucked behind) -->
  <g id="feet">
    <ellipse id="foot_left" cx="152" cy="462" rx="42" ry="17" fill="#1F6450"/>
    <ellipse id="foot_right" cx="356" cy="470" rx="48" ry="19" fill="#256F59"/>
  </g>

  <!-- Everything above the feet leans into the shield (pivot: 256,470) -->
  <g id="lean" transform="rotate(6 256 470)">

    <!-- Lower body -->
    <g id="body">
      <path d="M188 300 H324 C366 300 394 328 394 370 V410 C394 446 368 470 330 470 H182 C144 470 118 446 118 410 V370 C118 328 146 300 188 300 Z" fill="#2A7A62"/>
    </g>

    <!-- Right arm, behind the shield (holding it from behind) -->
    <g id="arm_right">
      <ellipse cx="380" cy="340" rx="54" ry="31" fill="#2F8269" transform="rotate(-37 380 340)"/>
    </g>

    <!-- Whole head (pivot: 256,320) -->
    <g id="head_group">
      <g id="ear_left">
        <circle cx="132" cy="74" r="40" fill="#2A7A62"/>
        <circle cx="140" cy="81" r="18" fill="#1F6450"/>
      </g>
      <g id="ear_right">
        <circle cx="380" cy="74" r="40" fill="#2A7A62"/>
        <circle cx="372" cy="81" r="18" fill="#1F6450"/>
      </g>

      <g id="head">
        <path d="M256 50 C373 50 451 128 451 225 C451 330 373 400 256 400 C139 400 61 330 61 225 C61 128 139 50 256 50 Z" fill="#2A7A62"/>
      </g>

      <g id="face">
        <path d="M256 128 C268 122 290 120 312 121 C370 125 404 172 404 236 C404 306 350 352 256 352 C162 352 108 306 108 236 C108 172 142 125 200 121 C222 120 244 122 256 128 Z" fill="#FCF6EA"/>
      </g>

      <g id="blush">
        <ellipse id="blush_left" cx="158" cy="264" rx="28" ry="15" fill="#F5B4A8" opacity="0.8"/>
        <ellipse id="blush_right" cx="354" cy="264" rx="28" ry="15" fill="#F5B4A8" opacity="0.8"/>
      </g>

      <g id="eye_left">
        <circle cx="196" cy="230" r="16" fill="#1B1F22"/>
        <circle id="eye_left_shine" cx="192" cy="227" r="5" fill="#FFFFFF"/>
      </g>
      <g id="eye_right">
        <circle cx="316" cy="230" r="16" fill="#1B1F22"/>
        <circle id="eye_right_shine" cx="312" cy="227" r="5" fill="#FFFFFF"/>
      </g>

      <!-- Eyelids: face-colored wedges that narrow the eyes toward the middle -->
      <g id="lid_left">
        <path d="M174 198 L220 198 L220 225 L174 213 Z" fill="#FCF6EA"/>
      </g>
      <g id="lid_right">
        <path d="M338 198 L292 198 L292 225 L338 213 Z" fill="#FCF6EA"/>
      </g>

      <!-- Determined brows: inner ends lowered -->
      <g id="brow_left">
        <path d="M176 196 Q194 199 214 209" fill="none" stroke="#2B1E16" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g id="brow_right">
        <path d="M336 196 Q318 199 298 209" fill="none" stroke="#2B1E16" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Small firm mouth -->
      <g id="mouth">
        <path d="M248 262 C251 256 261 256 264 262 Z" fill="#F0A32A" stroke="#F0A32A" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <g id="nose">
        <ellipse cx="256" cy="248" rx="15" ry="7.5" fill="#2B1E16"/>
      </g>
    </g>

    <!-- Belly patch -->
    <g id="belly">
      <path d="M256 360 C320 358 352 380 352 410 C352 446 314 466 256 466 C198 466 160 446 160 410 C160 380 192 358 256 360 Z" fill="#FBF3E3"/>
    </g>

    <!-- Padlock badge -->
    <g id="lock">
      <path d="M243 414 v-8 a13 13 0 0 1 26 0 v8" fill="none" stroke="#D9A21B" stroke-width="6" stroke-linecap="round"/>
      <rect x="234" y="411" width="44" height="34" rx="8" fill="#F2C230"/>
      <circle cx="256" cy="425" r="5" fill="#6B4A10"/>
      <rect x="254" y="427" width="4" height="10" rx="2" fill="#6B4A10"/>
    </g>

    <!-- Shield: wide and rounded, held low and angled outward (pivot: 340,370) -->
    <g id="shield" transform="translate(340 370) rotate(8) scale(0.85) translate(-362 -315)">
      <path d="M362 205 C398 222 440 228 477 224 C478 312 456 384 362 425 C268 384 246 312 247 224 C284 228 326 222 362 205 Z" fill="#8DE3C6" stroke="#5CC9A3" stroke-width="8" stroke-linejoin="round" opacity="0.95"/>
      <path d="M362 205 C398 222 440 228 477 224 C478 312 456 384 362 425 C268 384 246 312 247 224 C284 228 326 222 362 205 Z" fill="#B3F0DB" transform="translate(362 312) scale(0.8) translate(-362 -312)"/>
      <ellipse id="shield_glint" cx="298" cy="266" rx="10" ry="30" fill="#FFFFFF" opacity="0.45" transform="rotate(20 298 266)"/>
      <g id="shield_lock">
        <path d="M344 300 v-14 a18 18 0 0 1 36 0 v14" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <rect x="331" y="296" width="62" height="50" rx="12" fill="#FFFFFF"/>
        <circle cx="362" cy="315" r="7" fill="#5CC9A3"/>
        <rect x="359" y="317" width="6" height="16" rx="3" fill="#5CC9A3"/>
      </g>
    </g>

    <!-- Left arm pushing against the shield edge, same chunky style as Calm (pivot: shoulder 124,330) -->
    <g id="arm_left">
      <ellipse cx="190" cy="347" rx="68" ry="32" fill="#1F6450" opacity="0.35" transform="rotate(12 190 347)"/>
      <ellipse cx="188" cy="342" rx="68" ry="32" fill="#2F8269" transform="rotate(12 188 342)"/>
    </g>
  </g>

  <!-- Sparkles (each can twinkle on its own) -->
  <g id="sparkles">
    <path id="sparkle_big" d="M462 94 Q462 120 488 120 Q462 120 462 146 Q462 120 436 120 Q462 120 462 94 Z" fill="#F5C842"/>
    <path id="sparkle_small" d="M438 38 Q438 52 452 52 Q438 52 438 66 Q438 52 424 52 Q438 52 438 38 Z" fill="#F5C842"/>
    <path id="sparkle_left" d="M62 362 Q62 376 76 376 Q62 376 62 390 Q62 376 48 376 Q62 376 62 362 Z" fill="#F5C842"/>
  </g>
</svg>
