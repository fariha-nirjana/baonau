<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Mimo / Holding the line expression (v3)
    "Not now, wait": right forearm upright with the palm raised at cheek
    height against a teal barrier line, left hand holding an hourglass.
    Slight 3deg lean toward the barrier (pivot: 256,470), braced feet.
    Determined but calm face.
  -->

  <!-- Barrier line (pivot: 490,280; can glow or ripple when touched) -->
  <g id="barrier">
    <path d="M478 116 Q496 276 478 436" fill="none" stroke="#6CCBA6" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Impact marks just past the barrier -->
  <g id="fx">
    <rect x="498" y="238" width="12" height="6" rx="3" fill="#6CCBA6" transform="rotate(-30 504 241)"/>
    <rect x="499" y="264" width="12" height="6" rx="3" fill="#6CCBA6"/>
    <rect x="498" y="290" width="12" height="6" rx="3" fill="#6CCBA6" transform="rotate(30 504 293)"/>
  </g>

  <!-- Whole character, shifted left to give the raised hand room -->
  <g id="character" transform="translate(-34 0)">

  <!-- Ground shadow -->
  <g id="shadow">
    <ellipse cx="258" cy="483" rx="145" ry="11" fill="#2E6B57" opacity="0.12"/>
  </g>

  <!-- Feet: slightly braced (back foot darker) -->
  <g id="feet">
    <ellipse id="foot_left" cx="172" cy="464" rx="44" ry="17" fill="#1F6450"/>
    <ellipse id="foot_right" cx="340" cy="468" rx="47" ry="19" fill="#256F59"/>
  </g>

  <!-- Everything above the feet leans slightly toward the barrier (pivot: 256,470) -->
  <g id="lean" transform="rotate(3 256 470)">

    <!-- Lower body -->
    <g id="body">
      <path d="M188 300 H324 C366 300 394 328 394 370 V410 C394 446 368 470 330 470 H182 C144 470 118 446 118 410 V370 C118 328 146 300 188 300 Z" fill="#2A7A62"/>
    </g>

    <!-- Whole head, turned 3/4 toward the barrier (pivot: 256,320) -->
    <g id="head_group">
      <!-- Ears drift back (left) as the head turns -->
      <g id="ear_left" transform="translate(-10 4)">
        <circle cx="132" cy="74" r="40" fill="#2A7A62"/>
        <circle cx="140" cy="81" r="18" fill="#1F6450"/>
      </g>
      <g id="ear_right" transform="translate(-18 0)">
        <circle cx="380" cy="74" r="40" fill="#2A7A62"/>
        <circle cx="372" cy="81" r="18" fill="#1F6450"/>
      </g>

      <g id="head">
        <path d="M256 50 C373 50 451 128 451 225 C451 330 373 400 256 400 C139 400 61 330 61 225 C61 128 139 50 256 50 Z" fill="#2A7A62"/>
      </g>

      <!-- Face plate slides toward the barrier and narrows a little -->
      <g id="face" transform="translate(34 0) translate(256 236) scale(0.9 1) translate(-256 -236)">
        <path d="M256 128 C268 122 290 120 312 121 C370 125 404 172 404 236 C404 306 350 352 256 352 C162 352 108 306 108 236 C108 172 142 125 200 121 C222 120 244 122 256 128 Z" fill="#FCF6EA"/>
      </g>

      <g id="blush">
        <ellipse id="blush_left" cx="198" cy="266" rx="20" ry="14" fill="#F5B4A8" opacity="0.8"/>
        <ellipse id="blush_right" cx="384" cy="266" rx="26" ry="15" fill="#F5B4A8" opacity="0.8"/>
      </g>

      <!-- Eyes shifted toward the barrier; the far eye is slightly narrower -->
      <g id="eye_left">
        <ellipse cx="240" cy="230" rx="14" ry="16" fill="#1B1F22"/>
        <circle id="eye_left_shine" cx="244" cy="225" r="4.5" fill="#FFFFFF"/>
      </g>
      <g id="eye_right">
        <circle cx="342" cy="230" r="16" fill="#1B1F22"/>
        <circle id="eye_right_shine" cx="347" cy="225" r="5" fill="#FFFFFF"/>
      </g>

      <!-- Eyelids: gentle narrowing (firm, not angry) -->
      <g id="lid_left">
        <path d="M220 198 L262 198 L262 222 L220 213 Z" fill="#FCF6EA"/>
      </g>
      <g id="lid_right">
        <path d="M366 198 L320 198 L320 221 L366 213 Z" fill="#FCF6EA"/>
      </g>

      <!-- Determined brows -->
      <g id="brow_left">
        <path d="M222 198 Q238 200 256 207" fill="none" stroke="#2B1E16" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g id="brow_right">
        <path d="M364 197 Q346 199 326 206" fill="none" stroke="#2B1E16" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Small firm mouth -->
      <g id="mouth">
        <path d="M290 263 C293 257 303 257 306 263 Z" fill="#F0A32A" stroke="#F0A32A" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <g id="nose">
        <ellipse cx="298" cy="249" rx="14" ry="7.5" fill="#2B1E16"/>
      </g>
    </g>

    <!-- Belly patch, shifted toward the turn -->
    <g id="belly" transform="translate(24 0) translate(256 412) scale(0.92 1) translate(-256 -412)">
      <path d="M256 360 C320 358 352 380 352 410 C352 446 314 466 256 466 C198 466 160 446 160 410 C160 380 192 358 256 360 Z" fill="#FBF3E3"/>
    </g>

    <!-- Padlock badge -->
    <g id="lock" transform="translate(28 0)">
      <path d="M243 414 v-8 a13 13 0 0 1 26 0 v8" fill="none" stroke="#D9A21B" stroke-width="6" stroke-linecap="round"/>
      <rect x="234" y="411" width="44" height="34" rx="8" fill="#F2C230"/>
      <circle cx="256" cy="425" r="5" fill="#6B4A10"/>
      <rect x="254" y="427" width="4" height="10" rx="2" fill="#6B4A10"/>
    </g>

    <!-- Back arm (left), reaching forward to hold the hourglass -->
    <g id="arm_left">
      <ellipse cx="132" cy="378" rx="27" ry="46" fill="#1F6450" opacity="0.35" transform="rotate(-28 132 378)"/>
      <ellipse cx="130" cy="373" rx="27" ry="46" fill="#2F8269" transform="rotate(-28 130 373)"/>
    </g>

    <!-- Hourglass (pivot: 184,392; flip it 180deg for the "queued" moment) -->
    <g id="hourglass" transform="translate(14 -4)">
      <rect x="140" y="354" width="4" height="78" fill="#C98B12"/>
      <rect x="196" y="354" width="4" height="78" fill="#C98B12"/>
      <path d="M146 354 C146 378 164 386 170 392 C164 398 146 406 146 430 L194 430 C194 406 176 398 170 392 C176 386 194 378 194 354 Z" fill="#E4F7F0" stroke="#8DD9BE" stroke-width="3" stroke-linejoin="round"/>
      <g id="sand_top">
        <path d="M153 370 C157 380 166 386 170 390 C174 386 183 380 187 370 Z" fill="#F2C230"/>
      </g>
      <g id="sand_stream">
        <path d="M170 390 L170 420" stroke="#F2C230" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="sand_bottom">
        <path d="M152 428 C158 415 182 415 188 428 Z" fill="#F2C230"/>
      </g>
      <rect x="134" y="344" width="72" height="12" rx="5" fill="#D9A21B"/>
      <rect x="134" y="428" width="72" height="12" rx="5" fill="#D9A21B"/>
    </g>

    <!-- Back hand gripping the hourglass's side -->
    <g id="hand_left">
      <ellipse cx="158" cy="412" rx="21" ry="25" fill="#1F6450" opacity="0.35" transform="rotate(-10 158 412)"/>
      <ellipse cx="156" cy="408" rx="21" ry="25" fill="#2F8269" transform="rotate(-10 156 408)"/>
    </g>

    <!-- Front arm (right): forearm up, palm raised toward the barrier (pivot: elbow 404,376) -->
    <g id="arm_right">
      <g id="arm_right_forearm">
        <ellipse cx="440" cy="334" rx="27" ry="54" fill="#1F6450" opacity="0.35" transform="rotate(34 440 334)"/>
        <ellipse cx="436" cy="330" rx="27" ry="54" fill="#34896F" transform="rotate(34 436 330)"/>
      </g>
      <g id="hand_right">
        <ellipse cx="472" cy="266" rx="27" ry="36" fill="#1F6450" opacity="0.35" transform="rotate(8 472 266)"/>
        <ellipse cx="468" cy="262" rx="27" ry="36" fill="#34896F" transform="rotate(8 468 262)"/>
        <ellipse id="thumb_right" cx="444" cy="252" rx="9" ry="15" fill="#34896F" transform="rotate(-25 444 252)"/>
      </g>
    </g>
  </g>
  </g>
</svg>
