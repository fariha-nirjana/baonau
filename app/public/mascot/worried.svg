<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Mimo / Worried expression
    Same base as Calm. Changes: worried brows (inner ends raised),
    glossy eyes, small wobbly mouth, both hands clutched up near the chin,
    worry swirl above the head.
  -->

  <!-- Ground shadow -->
  <g id="shadow">
    <ellipse cx="256" cy="483" rx="140" ry="11" fill="#2E6B57" opacity="0.12"/>
  </g>

  <!-- Feet -->
  <g id="feet">
    <ellipse id="foot_left" cx="180" cy="466" rx="46" ry="18" fill="#256F59"/>
    <ellipse id="foot_right" cx="332" cy="466" rx="46" ry="18" fill="#256F59"/>
  </g>

  <!-- Lower body -->
  <g id="body">
    <path d="M188 300 H324 C366 300 394 328 394 370 V410 C394 446 368 470 330 470 H182 C144 470 118 446 118 410 V370 C118 328 146 300 188 300 Z" fill="#2A7A62"/>
  </g>

  <!-- Whole head (pivot: 256,320) -->
  <g id="head_group">
    <g id="ear_left">
      <circle cx="132" cy="74" r="40" fill="#2A7A62"/>
      <circle cx="140" cy="81" r="18" fill="#1F6450"/>
    </g>
    <g id="ear_right">
      <circle cx="380" cy="74" r="40" fill="#2A7A62"/>
      <circle cx="372" cy="81" r="18" fill="#1F6450"/>
    </g>

    <g id="head">
      <path d="M256 50 C373 50 451 128 451 225 C451 330 373 400 256 400 C139 400 61 330 61 225 C61 128 139 50 256 50 Z" fill="#2A7A62"/>
    </g>

    <g id="face">
      <path d="M256 128 C268 122 290 120 312 121 C370 125 404 172 404 236 C404 306 350 352 256 352 C162 352 108 306 108 236 C108 172 142 125 200 121 C222 120 244 122 256 128 Z" fill="#FCF6EA"/>
    </g>

    <g id="blush">
      <ellipse id="blush_left" cx="158" cy="264" rx="28" ry="15" fill="#F5B4A8" opacity="0.8"/>
      <ellipse id="blush_right" cx="354" cy="264" rx="28" ry="15" fill="#F5B4A8" opacity="0.8"/>
    </g>

    <!-- Worried brows: inner ends raised (pivot: each brow center) -->
    <g id="brow_left">
      <path d="M176 199 Q192 193 210 186" fill="none" stroke="#2B1E16" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g id="brow_right">
      <path d="M336 199 Q320 193 302 186" fill="none" stroke="#2B1E16" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Glossy eyes: a big shine plus a small one -->
    <g id="eye_left">
      <circle cx="196" cy="229" r="16" fill="#1B1F22"/>
      <circle id="eye_left_shine" cx="191" cy="223" r="6" fill="#FFFFFF"/>
      <circle cx="202" cy="235" r="2.5" fill="#FFFFFF"/>
    </g>
    <g id="eye_right">
      <circle cx="316" cy="229" r="16" fill="#1B1F22"/>
      <circle id="eye_right_shine" cx="311" cy="223" r="6" fill="#FFFFFF"/>
      <circle cx="322" cy="235" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Small downturned mouth, tucked under the nose -->
    <g id="mouth">
      <path d="M245 265 C248 255 264 255 267 265 C263 261 249 261 245 265 Z" fill="#F0A32A" stroke="#F0A32A" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <g id="nose">
      <ellipse cx="256" cy="248" rx="15" ry="7.5" fill="#2B1E16"/>
    </g>
  </g>

  <!-- Belly patch -->
  <g id="belly">
    <path d="M256 360 C320 358 352 380 352 410 C352 446 314 466 256 466 C198 466 160 446 160 410 C160 380 192 358 256 360 Z" fill="#FBF3E3"/>
  </g>

  <!-- Padlock badge -->
  <g id="lock">
    <path d="M243 414 v-8 a13 13 0 0 1 26 0 v8" fill="none" stroke="#D9A21B" stroke-width="6" stroke-linecap="round"/>
    <rect x="234" y="411" width="44" height="34" rx="8" fill="#F2C230"/>
    <circle cx="256" cy="425" r="5" fill="#6B4A10"/>
    <rect x="254" y="427" width="4" height="10" rx="2" fill="#6B4A10"/>
  </g>

  <!-- Left arm, hand clutched near the chin (pivot: shoulder 108,322; elbow 126,376) -->
  <g id="arm_left">
    <g id="arm_left_upper">
      <ellipse cx="120" cy="354" rx="28" ry="40" fill="#2F8269"/>
    </g>
    <g id="arm_left_forearm">
      <ellipse cx="172" cy="361" rx="54" ry="28" fill="#1F6450" opacity="0.35" transform="rotate(-26 172 361)"/>
      <ellipse cx="170" cy="356" rx="54" ry="28" fill="#2F8269" transform="rotate(-26 170 356)"/>
    </g>
    <g id="hand_left">
      <circle cx="212" cy="335" r="25" fill="#2F8269"/>
    </g>
  </g>

  <!-- Right arm, hand clutched near the chin (pivot: shoulder 404,322; elbow 386,376) -->
  <g id="arm_right">
    <g id="arm_right_upper">
      <ellipse cx="392" cy="354" rx="28" ry="40" fill="#2F8269"/>
    </g>
    <g id="arm_right_forearm">
      <ellipse cx="340" cy="361" rx="54" ry="28" fill="#1F6450" opacity="0.35" transform="rotate(26 340 361)"/>
      <ellipse cx="342" cy="356" rx="54" ry="28" fill="#2F8269" transform="rotate(26 342 356)"/>
    </g>
    <g id="hand_right">
      <circle cx="300" cy="335" r="25" fill="#2F8269"/>
    </g>
  </g>

  <!-- Accent marks -->
  <g id="fx">
    <rect x="28" y="181" width="28" height="9" rx="4.5" fill="#6CCBA6" transform="rotate(35 42 185)"/>
    <rect x="18" y="220" width="28" height="9" rx="4.5" fill="#6CCBA6"/>
  </g>

  <!-- Worry swirl (pivot: 456,62 for a slow spin) -->
  <g id="swirl">
    <path d="M450 60 C450 50 464 47 468 55 C473 65 462 73 452 70 C438 66 438 46 454 40 C472 34 488 47 486 63 C484 81 464 89 450 84 C442 81 436 88 434 98" fill="none" stroke="#2A7A62" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
