<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Mimo / Happy expression
    Same base as Calm. Changes: happy closed "^ ^" eyes, open smile, rosier cheeks,
    right arm raised in a little wave with motion marks, yellow sparkles.
    Each part is its own group with an id; pivots noted for rigging.
  -->

  <!-- Ground shadow -->
  <g id="shadow">
    <ellipse cx="256" cy="483" rx="140" ry="11" fill="#2E6B57" opacity="0.12"/>
  </g>

  <!-- Feet -->
  <g id="feet">
    <ellipse id="foot_left" cx="180" cy="466" rx="46" ry="18" fill="#256F59"/>
    <ellipse id="foot_right" cx="332" cy="466" rx="46" ry="18" fill="#256F59"/>
  </g>

  <!-- Lower body -->
  <g id="body">
    <path d="M188 300 H324 C366 300 394 328 394 370 V410 C394 446 368 470 330 470 H182 C144 470 118 446 118 410 V370 C118 328 146 300 188 300 Z" fill="#2A7A62"/>
  </g>

  <!-- Whole head (pivot: 256,390) -->
  <g id="head_group">
    <g id="ear_left">
      <circle cx="132" cy="74" r="40" fill="#2A7A62"/>
      <circle cx="140" cy="81" r="18" fill="#1F6450"/>
    </g>
    <g id="ear_right">
      <circle cx="380" cy="74" r="40" fill="#2A7A62"/>
      <circle cx="372" cy="81" r="18" fill="#1F6450"/>
    </g>

    <g id="head">
      <path d="M256 50 C373 50 451 128 451 225 C451 330 373 400 256 400 C139 400 61 330 61 225 C61 128 139 50 256 50 Z" fill="#2A7A62"/>
    </g>

    <g id="face">
      <path d="M256 128 C268 122 290 120 312 121 C370 125 404 172 404 236 C404 306 350 352 256 352 C162 352 108 306 108 236 C108 172 142 125 200 121 C222 120 244 122 256 128 Z" fill="#FCF6EA"/>
    </g>

    <!-- Rosier cheeks -->
    <g id="blush">
      <ellipse id="blush_left" cx="160" cy="262" rx="30" ry="16" fill="#F5A9A0" opacity="0.85"/>
      <ellipse id="blush_right" cx="352" cy="262" rx="30" ry="16" fill="#F5A9A0" opacity="0.85"/>
    </g>

    <!-- Happy closed eyes (pivot: each eye center) -->
    <g id="eye_left">
      <path d="M178 234 C188.67 220 199.33 220 210 234" fill="none" stroke="#1B1F22" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="eye_right">
      <path d="M302 234 C312.67 220 323.33 220 334 234" fill="none" stroke="#1B1F22" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Open smile with a little tongue -->
    <g id="mouth">
      <path d="M240 254 L272 254 C272 266 266 274 256 274 C246 274 240 266 240 254 Z" fill="#F0A32A"/>
      <ellipse id="tongue" cx="256" cy="267" rx="7" ry="3.5" fill="#E8746B"/>
    </g>

    <g id="nose">
      <ellipse cx="256" cy="248" rx="15" ry="7.5" fill="#2B1E16"/>
    </g>
  </g>

  <!-- Belly patch -->
  <g id="belly">
    <path d="M256 360 C320 358 352 380 352 410 C352 446 314 466 256 466 C198 466 160 446 160 410 C160 380 192 358 256 360 Z" fill="#FBF3E3"/>
  </g>

  <!-- Padlock badge -->
  <g id="lock">
    <path d="M243 414 v-8 a13 13 0 0 1 26 0 v8" fill="none" stroke="#D9A21B" stroke-width="6" stroke-linecap="round"/>
    <rect x="234" y="411" width="44" height="34" rx="8" fill="#F2C230"/>
    <circle cx="256" cy="425" r="5" fill="#6B4A10"/>
    <rect x="254" y="427" width="4" height="10" rx="2" fill="#6B4A10"/>
  </g>

  <!-- Left arm, same hug pose as Calm (pivot: 97,305) -->
  <g id="arm_left">
    <ellipse cx="134" cy="337" rx="54" ry="31" fill="#1F6450" opacity="0.35" transform="rotate(37 134 337)"/>
    <ellipse cx="132" cy="332" rx="54" ry="31" fill="#2F8269" transform="rotate(37 132 332)"/>
  </g>

  <!-- Right arm raised in a wave (pivot: elbow 404,330; rotate +-12deg to wave) -->
  <g id="arm_right">
    <g id="arm_right_forearm">
      <ellipse cx="441" cy="289" rx="27" ry="56" fill="#1F6450" opacity="0.35" transform="rotate(36 441 289)"/>
      <ellipse cx="437" cy="285" rx="27" ry="56" fill="#34896F" transform="rotate(36 437 285)"/>
    </g>
    <g id="hand_right">
      <circle cx="478" cy="228" r="26" fill="#1F6450" opacity="0.35"/>
      <circle cx="474" cy="224" r="26" fill="#34896F"/>
    </g>
  </g>

  <!-- Little wave marks above the paw -->
  <g id="wave_marks">
    <path d="M452 176 Q462 166 474 168" fill="none" stroke="#6CCBA6" stroke-width="6" stroke-linecap="round"/>
    <path d="M484 180 Q494 176 500 186" fill="none" stroke="#6CCBA6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sparkles (each can twinkle on its own) -->
  <g id="sparkles">
    <path id="sparkle_big" d="M46 140 Q46 160 66 160 Q46 160 46 180 Q46 160 26 160 Q46 160 46 140 Z" fill="#F5C842"/>
    <path id="sparkle_small" d="M62 72 Q62 84 74 84 Q62 84 62 96 Q62 84 50 84 Q62 84 62 72 Z" fill="#F5C842"/>
    <path id="sparkle_right" d="M440 52 Q440 66 454 66 Q440 66 440 80 Q440 66 426 66 Q440 66 440 52 Z" fill="#F5C842"/>
  </g>
</svg>
