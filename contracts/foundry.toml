[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# FISCO BCOS supports Solidity up to 0.8.11, so everything is written for and compiled with that version
solc = "0.8.11"
# the newest EVM version this compiler knows; it has no opcodes that older chains lack
evm_version = "london"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false

# long run for the numbers quoted in the security report: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 250
fail_on_revert = true
