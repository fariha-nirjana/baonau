[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# paris keeps the bytecode free of newer opcodes, so it also runs on older EVM chains
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false
