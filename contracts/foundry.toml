[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# paris keeps the bytecode free of newer opcodes, so it also runs on older EVM chains
evm_version = "paris"
optimizer = true
# low on purpose: PolicyVault is close to the 24 KB contract size limit, and size matters more here than gas
optimizer_runs = 1
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false

# long run for the numbers quoted in the security report: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 250
fail_on_revert = true
